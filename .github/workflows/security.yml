name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'  # Semanal lunes 2AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.sha }}
          extra_args: --json --fail

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          args: --error --json=semgrep-results.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.json
          category: semgrep

  # Check for Subresource Integrity on external scripts
  sri-check:
    name: Subresource Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for scripts without integrity
        run: |
          echo "Checking for external scripts without integrity attribute..."
          MISSING=$(grep -r 'src="https://' --include="*.html" | grep -v 'integrity=' || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::Found external scripts without integrity attribute:"
            echo "$MISSING"
          else
            echo "✅ All external scripts have integrity attributes"
          fi